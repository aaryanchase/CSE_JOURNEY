<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | KaamConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold text-primary" href="index.html">
                KaamConnect
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="services.html">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="workers.html">Workers</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-primary ms-lg-2" href="login.html">Login</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="container py-5">

        <div class="text-center mb-5">
            <h1 class="fw-bold">Contact Us</h1>

            <p class="text-secondary">
                Have a question? Send us a message.
            </p>
        </div>

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4">

                        <form action="#" method="get">

                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <input type="text" class="form-control"
                                    id="name" name="name"
                                    placeholder="Enter your name" required>
                            </div>

                            <div class="mb-3">
                                <label for="contactEmail" class="form-label">
                                    Email Address
                                </label>

                                <input type="email" class="form-control"
                                    id="contactEmail" name="email"
                                    placeholder="Enter your email" required>
                            </div>

                            <div class="mb-3">
                                <label for="subject" class="form-label">
                                    Subject
                                </label>

                                <input type="text" class="form-control"
                                    id="subject" name="subject"
                                    placeholder="Enter the subject" required>
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label">
                                    Your Message
                                </label>

                                <textarea class="form-control"
                                    id="message" name="message"
                                    rows="5"
                                    placeholder="Write your message here"
                                    required></textarea>
                            </div>

                            <button type="submit"
                                class="btn btn-primary w-100">
                                Send Message
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">

        <div class="container text-center">

            <h5>KaamConnect</h5>

            <p>Connecting people with trusted professionals.</p>

            <a href="index.html" class="footer-link">Home</a>
            <a href="services.html" class="footer-link">Services</a>
            <a href="workers.html" class="footer-link">Workers</a>

            <hr>

            <p class="mb-0">
                &copy; 2026 KaamConnect. All rights reserved.
            </p>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
