<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | KaamConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold text-primary" href="index.html">
                KaamConnect
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="services.html">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="workers.html">Workers</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-primary ms-lg-2 active" href="login.html">Login</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

        <!-- Login Section -->
    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="card shadow border-0">

                        <div class="card-body p-4 p-md-5">

                            <h2 class="text-center fw-bold mb-2">
                                Welcome Back!
                            </h2>

                            <p class="text-center text-secondary mb-4">
                                Login to your KaamConnect account.
                            </p>

                            <form action="#" method="get">

                                <!-- Email -->
                                <div class="mb-3">

                                    <label for="email" class="form-label">
                                        Email Address
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        name="email"
                                        placeholder="Enter your email"
                                        required>

                                </div>

                                <!-- Password -->
                                <div class="mb-3">

                                    <label for="password" class="form-label">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="Enter your password"
                                        required>

                                </div>

                                <!-- Remember Me -->
                                <div class="form-check mb-3">

                                    <input
                                        type="checkbox"
                                        class="form-check-input"
                                        id="remember">

                                    <label class="form-check-label" for="remember">
                                        Remember me
                                    </label>

                                </div>

                                <!-- Login Button -->
                                <button type="submit"
                                    class="btn btn-primary w-100">
                                    Login
                                </button>

                            </form>

                            <p class="text-center mt-4 mb-0">
                                Don't have an account?
                                <a href="#register">Register here</a>
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

        <!-- Footer -->
    <footer class="bg-dark text-white py-4">

        <div class="container text-center">

            <h5>KaamConnect</h5>

            <p>Connecting people with trusted professionals.</p>

            <a href="index.html" class="footer-link">Home</a>
            <a href="services.html" class="footer-link">Services</a>
            <a href="workers.html" class="footer-link">Workers</a>

            <hr>

            <p class="mb-0">
                &copy; 2026 KaamConnect. All rights reserved.
            </p>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
